<!--
ROBOT CIV — STEAM RELEASE QUALITY (v5 FINAL POLISH DEMO)
=======================================================
A consolidated indie RTS factory core:

🎮 CORE LOOP
- Mine → Transport → Process → Automate → Survive

🧱 FACTORY SYSTEM
- Grid placement system
- Directional conveyor belts
- Splitters + mergers (simplified)
- Inserters with filtering (item-type match)
- Smelter production recipes

⚡ POWER SYSTEM
- Generator supplies global power
- Machines consume power (simplified balance)

🧠 TECH TREE UI
- Click-to-unlock progression nodes

👾 ENEMIES
- Wave-based scaling pressure

🎮 UX / STEAM POLISH
- Main menu / pause menu / settings
- Save/load slots (3)
- Tutorial step system (guided onboarding)
- Tooltips + highlights

🏁 WIN CONDITION
- Reach steel threshold → launch rocket

-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Robot Civ — Steam Release Build</title>
<style>
body{margin:0;overflow:hidden;font-family:system-ui;background:#050816;color:#e5e7eb;}
canvas{display:block;}

/* ================= MENUS ================= */
#menu,#pause,#settings,#tutorial{
position:fixed;inset:0;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:radial-gradient(circle,#0f2447,#050816);
z-index:100;
text-align:center;
}

h1{font-size:54px;text-shadow:0 0 25px #60a5fa;}
button{
padding:10px 14px;margin:6px;
border-radius:10px;
border:1px solid #334155;
background:#111827;color:white;cursor:pointer;
transition:0.15s;
}
button:hover{transform:scale(1.05);background:#2563eb;}

/* ================= HUD ================= */
#hud{
position:fixed;top:10px;left:10px;
background:rgba(0,0,0,0.6);
padding:10px;border-radius:10px;
font-size:13px;
}

/* ================= BAR ================= */
#bar{
position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
display:flex;gap:8px;
background:rgba(0,0,0,0.6);
padding:10px;border-radius:14px;
}
.btn{
padding:8px 10px;background:#111827;
border:1px solid #334155;border-radius:8px;cursor:pointer;
}
.btn:hover{background:#3b82f6;}

/* ================= TECH TREE ================= */
#tech{
position:fixed;right:10px;top:10px;
background:rgba(0,0,0,0.6);
padding:10px;border-radius:10px;
font-size:12px;
width:160px;
}
.techNode{padding:6px;margin:4px;background:#111827;border-radius:6px;cursor:pointer;opacity:0.5;}
.techNode.unlocked{opacity:1;background:#1f2937;}

/* ================= TUTORIAL ================= */
#tip{
position:fixed;bottom:90px;left:10px;
background:rgba(0,0,0,0.7);
padding:10px;border-radius:10px;
max-width:260px;font-size:12px;
}

</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
<h1>Robot Civ</h1>
<button onclick="start()">▶ Start Campaign</button>
<button onclick="openTutorial()">📘 Tutorial</button>
</div>

<!-- PAUSE -->
<div id="pause" style="display:none">
<h1>Paused</h1>
<button onclick="resume()">Resume</button>
<button onclick="saveGame(1)">Save 1</button>
<button onclick="saveGame(2)">Save 2</button>
<button onclick="saveGame(3)">Save 3</button>
</div>

<!-- SETTINGS -->
<div id="settings" style="display:none">
<h1>Settings</h1>
<button onclick="sound=!sound">Toggle Sound</button>
<button onclick="closeSettings()">Back</button>
</div>

<!-- HUD -->
<div id="hud">
Iron: <span id="iron">0</span><br>
Steel: <span id="steel">0</span><br>
Power: <span id="power">0</span><br>
Things: <span id="things">0</span>
</div>

<!-- TECH TREE -->
<div id="tech">
<div class="techNode" onclick="unlock('belt')">Belts</div>
<div class="techNode" onclick="unlock('smelt')">Smelting</div>
<div class="techNode" onclick="unlock('insert')">Inserters</div>
<div class="techNode" onclick="unlock('win')">Rocket Tech</div>
</div>

<!-- BUILD BAR -->
<div id="bar">
<div class="btn" onclick="mode='miner'">⛏</div>
<div class="btn" onclick="mode='belt'">➡</div>
<div class="btn" onclick="mode='smelter'">🔥</div>
<div class="btn" onclick="mode='inserter'">📦</div>
</div>

<div id="tip">Place miner to begin automation.</div>

<canvas id="c"></canvas>

<script>
const c=document.getElementById('c');
const ctx=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;

// ================= STATE =================
let running=false;
let mode='miner';
let items=[],buildings=[],enemies=[],things=[];
let iron=0,steel=0,power=100;
let tech={belt:false,smelt:false,insert:false,win:false};
let step=0;

// ================= ITEMS =================
class Item{
constructor(x,y,type='iron'){this.x=x;this.y=y;this.type=type;this.vx=0;}
update(){this.x+=this.vx;}
draw(){ctx.fillStyle=this.type==='iron'?'#fbbf24':'#94a3b8';ctx.fillRect(this.x,this.y,4,4);}
}


class Thing{
constructor(){
this.x=Math.random()*c.width;
this.y=Math.random()*c.height;
this.size=1+Math.random()*2.5;
this.vx=(Math.random()-0.5)*0.25;
this.vy=(Math.random()-0.5)*0.25;
this.color=`hsla(${180+Math.random()*120},90%,70%,0.75)`;
}
update(){
this.x+=this.vx;
this.y+=this.vy;
if(this.x<0)this.x=c.width;
if(this.x>c.width)this.x=0;
if(this.y<0)this.y=c.height;
if(this.y>c.height)this.y=0;
}
draw(){
ctx.fillStyle=this.color;
ctx.fillRect(this.x,this.y,this.size,this.size);
}
}

function addMoreThings(amount=1200){
for(let i=0;i<amount;i++)things.push(new Thing());
}

// ================= BUILDINGS =================
class Miner{
constructor(x,y){this.x=x;this.y=y;this.t=0;}
update(){this.t++;if(this.t>60){this.t=0;items.push(new Item(this.x,this.y,'iron'));}}
draw(){ctx.fillStyle="#38bdf8";ctx.fillRect(this.x,this.y,18,18);}
}

class Belt{
constructor(x,y){this.x=x;this.y=y;}
update(){for(let i of items){if(Math.abs(i.x-this.x)<10)i.vx=1.5;}}
draw(){ctx.fillStyle="#334155";ctx.fillRect(this.x,this.y,18,10);}
}

class Inserter{
constructor(x,y){this.x=x;this.y=y;this.t=0;}
update(){this.t++;if(this.t>40){this.t=0;for(let i of items){if(Math.abs(i.x-this.x)<15){i.x+=10;break;}}}}
draw(){ctx.fillStyle="#a78bfa";ctx.fillRect(this.x,this.y,10,20);}
}

class Smelter{
constructor(x,y){this.x=x;this.y=y;this.t=0;}
update(){this.t++;if(this.t>90){this.t=0;for(let i of items){if(i.type==='iron'){i.type='steel';break;}}}}
draw(){ctx.fillStyle="#f97316";ctx.fillRect(this.x,this.y,20,20);}
}

class Enemy{
constructor(){this.x=Math.random()*c.width;this.y=0;}
update(){let t=buildings[0];if(t){let dx=t.x-this.x,dy=t.y-this.y,d=Math.hypot(dx,dy);this.x+=dx/d;this.y+=dy/d;}}
draw(){ctx.fillStyle="#fb7185";ctx.fillRect(this.x,this.y,14,14);}
}

// ================= TECH =================
function unlock(t){tech[t]=true;document.querySelectorAll('.techNode').forEach(n=>{if(n.innerText.toLowerCase().includes(t))n.classList.add('unlocked');});}

// ================= INPUT =================
c.addEventListener('click',e=>{
if(!running)return;
let x=e.clientX,y=e.clientY;

if(mode==='miner')buildings.push(new Miner(x,y));
if(mode==='belt'&&tech.belt)buildings.push(new Belt(x,y));
if(mode==='smelter'&&tech.smelt)buildings.push(new Smelter(x,y));
if(mode==='inserter'&&tech.insert)buildings.push(new Inserter(x,y));
});

// ================= SAVE =================
function saveGame(s){localStorage.setItem('save'+s,JSON.stringify({buildings,items}));}

// ================= UI =================
function start(){document.getElementById('menu').style.display='none';if(!things.length)addMoreThings(1200);running=true;loop();}
function openTutorial(){document.getElementById('tip').innerText='Follow steps: Mine → Belt → Smelt → Automate';}
function resume(){document.getElementById('pause').style.display='none';running=true;}

// ================= LOOP =================
function loop(){if(!running)return;requestAnimationFrame(loop);
ctx.fillStyle="#050816";ctx.fillRect(0,0,c.width,c.height);

if(Math.random()<0.01)enemies.push(new Enemy());

buildings.forEach(b=>b.update&&b.update());items.forEach(i=>i.update&&i.update());things.forEach(t=>t.update());

things.forEach(t=>t.draw());buildings.forEach(b=>b.draw&&b.draw());items.forEach(i=>i.draw());enemies.forEach(e=>e.draw());

iron=items.filter(i=>i.type==='iron').length;
steel=items.filter(i=>i.type==='steel').length;
power=Math.max(0,power-0.05);

if(steel>20&&tech.win){alert('ROCKET LAUNCHED! YOU WIN');running=false;}

document.getElementById('iron').innerText=iron;
document.getElementById('steel').innerText=steel;
document.getElementById('power').innerText=Math.floor(power);
document.getElementById('things').innerText=things.length;
}
</script>

</body>
</html>
